spec_version: v1
kind: agent
name: simple_llm_agent
title: Simple LLM Agent
description: |
  A plain LangGraph agent using ChatOpenAI with no Agentic SDK code.
  Demonstrates that existing LangGraph agents can be imported into wxO
  with minimal changes — only the create_agent() entry point is required.

# The LangGraph framework identifier — required for all LangGraph package imports
framework: langgraph

deployment:
  code_bundle:
    # Format: "module_filename:factory_function_name"
    entrypoint: "agent:create_agent"

# The OpenAI API key is injected from this connection as the env var:
# openai_connection_api_key
connections:
  global_requirements:
    required_app_ids:
      - openai_connection
