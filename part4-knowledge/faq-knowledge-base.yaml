spec_version: v1
kind: knowledge_base
name: customer-support-faq
description: Frequently asked questions for customer support including shipping, returns, payments, account management, and order management

# Reference to the FAQ PDF file
# Workshop participants should place this YAML file and FAQ.pdf in the same directory
documents:
  - FAQ.pdf

# Vector index configuration for built-in Milvus
vector_index:
  embeddings_model_name: ibm/slate-125m-english-rtrvr-v2
  chunk_size: 500
  chunk_overlap: 50
  limit: 10
  extraction_strategy: standard

