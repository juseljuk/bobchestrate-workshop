# Orchestrator native agent — wires a LangGraph agent as a collaborator (§12)
#
# Replace "my_langgraph_agent" with the actual name from your LangGraph agent.yaml.
# The name must match exactly (case-sensitive).
# style: react_core is required from ADK v2.13+ — default/react/planner are deprecated.

spec_version: v1
kind: native
style: react_core
name: orchestrator_agent
llm: groq/openai/gpt-oss-120b
description: |
  Orchestrator that routes specialist tasks to the LangGraph collaborator.

instructions: |
  When the user asks about [your domain], delegate to the my_langgraph_agent collaborator.
  Handle all other queries directly.

collaborators:
  - my_langgraph_agent   # must match the name: field in the LangGraph agent.yaml exactly

tools: []
